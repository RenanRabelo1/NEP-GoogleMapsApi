<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interativo</title>
    <link rel="stylesheet" href="src/styles/style.css">
  </head>
  <body>
    <div id="map"></div>
    <input
      id="coordenadas"
      name="coordenadas"
      type="text"
      placeholder="Latitude, Longitude"
      aria-label="Latitude e longitude"
    >

    <input
      id="titulo-marcador"
      name="titulo-marcador"
      type="text"
      placeholder="Título do marcador"
      aria-label="Título do marcador"
    >

    <button id="adicionar-ponto" type="button">Adicionar ponto</button>

    <script src="src/features/mapa/mapa.js"></script>
    <script
      async
      src="https://maps.googleapis.com/maps/api/js?key=SUA_CHAVE_DA_API&amp;loading=async&amp;callback=inicializarMapa"
    ></script>
  </body>
</html>
